<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lightscore and contrast check scores for PC Part Shop's website.">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>PC Part Shop - Check Scores</title>
</head>
<body>
    <div class="grid-container">
        <img class="grid-img" src="./checkscores/lighthome.webp"/>
        <img class="grid-img padd" src="./checkscores/darkhome.webp"/>

        <img class="grid-img" src="./checkscores/lightproducts.webp"/>
        <img class="grid-img" src="./checkscores/darkproducts.webp"/>

        <img class="grid-img" src="./checkscores/lightcontact.webp"/>

<style>
    body {
        background-color: rgb(30,30,30);
        overflow-x: hidden;
    }
    .grid-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 50px;
        width: 100vw;
        padding: 50px 0px
    }

    .grid-img {
        width: 45%;
    }
