<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lightscore and contrast check scores for PC Part Shop's website.">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>PC Part Shop - Check Scores</title>
</head>
<body>
    <section class="grid-container">
        <img class="grid-img" src="./checkscores/lighthome.webp"/>
        <img class="grid-img padd" src="./checkscores/darkhome.webp"/>

        <img class="grid-img" src="./checkscores/lightproducts.webp"/>
        <img class="grid-img" src="./checkscores/darkproducts.webp"/>

        <img class="grid-img" src="./checkscores/lightcontact.webp"/>
        <img class="grid-img" src="./checkscores/darkcontact.webp"/>

        <img class="grid-img" src="./checkscores/lightscorehome.webp"/>
        <img class="grid-img" src="./checkscores/lightscoreproducts.webp"/>
        <img class="grid-img" src="./checkscores/lightscorecontacts.webp"/>
    </section>

    <section class="font-info">
        <h1>Font</h1>
        <p>Font is the basic "Arial, Helvetica, sans-serif". I originally went with a Google Font called <a href="https://fonts.google.com/specimen/Elms+Sans">Elms Sans</a>, but it ruined load times so I removed it.
<pre>body {
    font-family: Arial, Helvetica, sans-serif;
}</pre>
    </section>
    
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: rgb(30,30,30);
        color: white;
        overflow-x: hidden;
        padding-bottom: 100px;
    }

    .grid-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 50px;
        width: 100vw;
        padding: 50px 0px
    }

    .grid-img {
        width: 45%;
    }

    .font-info {
        padding: 10px 30px;
        width: 30vw;

        border: 1px solid rgb(80,80,80);
        border-radius: 20px;
        background-color: rgb(20,20,20);
        margin: 0px auto;
    }

    pre {
        background-color: rgb(40,40,40);
        padding: 10px;
        border-radius: 10px;
    }
</style>
</body>
</html>
