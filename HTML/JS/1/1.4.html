<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 1.4</title>
</head>
<body>
    <h1>Tehtävä 1.4</h1>
    <p id="target"></p>
    <button onclick="getHouse()">new house</button>
<script>
    function getHouse() {
        const input = prompt("What is your name?");
        const rand = Math.floor(Math.random() * 4);
        let house = "";

        switch (rand) {
            case 0:
                house = "Gryffindor";
                break;
            case 1:
                house = "Slytherin";
                break;
            case 2:
                house = "Huffelpuff";
                break;
            case 3:
                house = "Ravenclaw";
                break;
            default:
                house = "Muggle";
        }

        document.getElementById("target").innerHTML = `${input}, you are a ${house}!`;
    }

    getHouse();
</script>
</body>
</html>
