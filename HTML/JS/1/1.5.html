<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 1.5</title>
</head>
<body>
    <h1>Tehtävä 1.5</h1>
    <button onclick="isLeapYear()">check if another year is a leap year</button>
    <ul id="target">
    </ul>

<script>
    function isLeapYear() {
        const year = parseInt(prompt("Give a year:"));
        const li = document.createElement("li");

        if ((year % 4 === 0 && year % 100 != 0) || year % 400 === 0) {
            li.innerHTML = `The year ${year} is a leap year!`;
        }
        else {
            li.innerHTML = `The year ${year} is not a leap year.`;
        }

        document.getElementById("target").append(li);
    }

    isLeapYear();
</script>
</body>
</html>
