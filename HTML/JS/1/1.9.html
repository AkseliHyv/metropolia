<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 1.9</title>
</head>
<body>
    <h1>Tehtävä 1.9</h1>
    <p id="target"></p>
    <button onclick="isPrime()">check a new number</button>
<script>
    function isPrime() {
        const num = parseInt(prompt("Give a number:"));
        let isPrime = true;

        if (num <= 1) {
            isPrime = false;
        } else {
            for (let i = 2; i < num; i++) {
                if (num % i === 0) {
                    isPrime = false;
                    break;
                }
            }
        }

        document.getElementById("target").innerHTML = isPrime ? `Number ${num} is prime!` : `Number ${num} is not a prime.`;
    }

    isPrime();
</script>
</body>
</html>
