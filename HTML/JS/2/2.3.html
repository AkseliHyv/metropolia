<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 2.3</title>
</head>
<body>
    <h1>Tehtävä 2.3</h1>
    <ul id="target"></ul>
    
<script>
    dogs = [];
    for (let i = 0; i < 6; i++) {
        dogs.push(prompt("Enter a dog name:"));
    }

    dogs.sort().reverse();

    const ul = document.getElementById("target");
    for (let dog of dogs) {
        const li = document.createElement("li");
        li.innerHTML = dog;
        ul.appendChild(li);
    }
</script>
</body>
</html>
