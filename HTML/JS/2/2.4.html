<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 2.4</title>
</head>
<body>
    <h1>Tehtävä 2.4</h1>

<script>
    let num = 1;
    let nums = [];
    while (num !== 0) {
        num = parseInt(prompt("Enter a number (0 to stop):"));
        if (num !== 0) {
            nums.push(num);
        }
    }

    nums.sort((a,b) => a-b);

    for (let num of nums) {
        console.log(num);
    }
</script>
</body>
</html>
