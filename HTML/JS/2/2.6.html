<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 2.6</title>
</head>
<body>
    <h1>Tehtävä 2.6</h1>
    <ul id="target"></ul>
<script>
    function rollDice() {
        return Math.floor(Math.random() * 6) + 1;
    }

    let roll = 0;
    let rolls = [];
    while (roll !== 6) {
        roll = rollDice();
        rolls.push(roll);
    }

    for (let roll of rolls) {
        const li = document.createElement("li");
        li.innerHTML = roll;
        document.getElementById("target").appendChild(li);
    }
</script>
</body>
</html>
